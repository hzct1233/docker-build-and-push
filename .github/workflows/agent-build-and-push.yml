name: agent Build and Push

on:
  push:
    branches: [main, master]
    tags: ['v*']
  schedule:
    - cron: '0 */12 * * *' # 每 12 小时（UTC 00:00 / 12:00，即北京时间 08:00 / 20:00）检查上游新版本
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新构建（忽略已有 tag 的检查）'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  # 前置检查：读取上游最新版本，判断是否已经有对应镜像，避免重复构建
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Resolve upstream version
        id: version
        run: |
          TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/komari-monitor/komari-agent/releases/latest \
            | jq -r '.tag_name')
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "upstream ${TAG} -> agent-${VERSION}"

      - name: Check if image tag already exists
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "强制重建，跳过版本检查"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/hzct123/komari/tags/agent-${VERSION}")
          if [ "$HTTP" = "200" ]; then
            echo "tag agent-${VERSION} 已存在，跳过构建"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "检测到新版本 agent-${VERSION}，触发构建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: hzct123
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./komari-agent
          file: ./komari-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # agent 始终指向最新；agent-<版本> 与上游版本同步
          tags: |
            ghcr.io/${{ github.repository_owner }}/komari:agent-${{ needs.check.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/komari:agent
            hzct123/komari:agent-${{ needs.check.outputs.version }}
            hzct123/komari:agent
